<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 350" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&amp;display=swap');
      
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(5deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(10px) translateX(-10px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.1); }
      }
      @keyframes drawLine {
        from { stroke-dashoffset: 1000; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes fadeType {
        0% { opacity: 0; transform: translateX(-20px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      @keyframes scanline {
        0% { transform: translateY(-350px); }
        100% { transform: translateY(350px); }
      }
      
      .bg { fill: #171B1C; }
      .grid-line { stroke: #183B3F; stroke-width: 1; opacity: 0.4; }
      
      .text-title {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 56px;
        font-weight: 700;
        fill: #E7E0D4;
        animation: fadeType 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      
      .text-subtitle {
        font-family: 'Space Grotesk', monospace;
        font-size: 22px;
        fill: #38B2AC;
        letter-spacing: 2px;
        animation: fadeType 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s forwards;
        opacity: 0;
      }

      .text-detail {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 14px;
        fill: #8b949e;
        animation: fadeType 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 1s forwards;
        opacity: 0;
      }

      .line-accent {
        stroke: #38B2AC;
        stroke-width: 2;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: drawLine 2.5s ease-out 0.2s forwards;
        fill: none;
      }
      
      .shape1 { animation: float1 8s ease-in-out infinite; fill: none; stroke: #183B3F; stroke-width: 2; }
      .shape2 { animation: float2 10s ease-in-out infinite reverse; fill: none; stroke: #38B2AC; stroke-width: 1.5; opacity: 0.6; }
      .shape3 { animation: float1 12s ease-in-out infinite 1s; fill: none; stroke: #E7E0D4; stroke-width: 1; opacity: 0.3; }
      
      .scan {
        fill: url(#scanGrad);
        animation: scanline 8s linear infinite;
        opacity: 0.15;
      }
    </style>
    
    <radialGradient id="glow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#183B3F" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#171B1C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38B2AC" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38B2AC" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38B2AC" stop-opacity="0"/>
    </linearGradient>
    
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" class="grid-line"/>
    </pattern>
  </defs>

  <!-- Base Background -->
  <rect width="100%" height="100%" class="bg" rx="15"/>
  
  <!-- Grid & Glow -->
  <rect width="100%" height="100%" fill="url(#grid)" rx="15"/>
  <circle cx="200" cy="175" r="350" fill="url(#glow)" style="animation: pulseGlow 6s infinite alternate;"/>

  <!-- Geometric Abstract Shapes (Floating) -->
  <g transform="translate(650, 100)">
    <circle cx="0" cy="0" r="60" class="shape1"/>
    <rect x="-40" y="-40" width="80" height="80" class="shape2" transform="rotate(45)"/>
    <polygon points="0,-80 70,40 -70,40" class="shape3"/>
    <!-- Orbiting dots -->
    <circle cx="60" cy="60" r="3" fill="#38B2AC" class="shape2" style="animation-duration: 4s;"/>
    <circle cx="-50" cy="-30" r="2" fill="#E7E0D4" class="shape1" style="animation-duration: 3s;"/>
  </g>

  <!-- Left Side Geometric Accents -->
  <g transform="translate(80, 250)">
    <circle cx="0" cy="0" r="20" class="shape3"/>
    <line x1="-30" y1="0" x2="30" y2="0" class="shape2"/>
    <line x1="0" y1="-30" x2="0" y2="30" class="shape2"/>
  </g>

  <!-- Decorative Animated Lines -->
  <path d="M 50 175 L 120 175 L 150 145 L 800 145" class="line-accent"/>
  <path d="M 50 190 L 100 190 L 120 210 L 400 210" class="line-accent" style="animation-delay: 0.5s; stroke-width: 1; opacity: 0.5;"/>

  <!-- Typography -->
  <g transform="translate(150, 130)">
    <text x="0" y="0" class="text-title">IBRAHIM SHAKEEL</text>
    <text x="0" y="45" class="text-subtitle">AI &amp; FULL-STACK PRODUCT ENGINEER</text>
    <text x="0" y="105" class="text-detail">> TURNING COMPLEX PROBLEMS INTO SIMPLE SYSTEMS</text>
    <text x="0" y="130" class="text-detail">> BUILDING AI AUTOMATION PIPELINES &amp; SAAS</text>
  </g>

  <!-- Scanline effect overlay -->
  <rect width="100%" height="150" class="scan" rx="15"/>
</svg>
