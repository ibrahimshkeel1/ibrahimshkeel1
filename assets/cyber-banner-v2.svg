<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0D1117; }
      
      /* Typography */
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 52px; font-weight: 900; fill: #E6EDF3; letter-spacing: 4px; }
      .text-subtitle { font-family: ui-monospace, SFMono-Regular, Monaco, monospace; font-size: 16px; fill: #3FB950; letter-spacing: 2px; }
      
      /* Animations */
      @keyframes float-slow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.15; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(1.05); }
      }
      @keyframes draw-line {
        from { stroke-dashoffset: 1000; }
        to { stroke-dashoffset: 0; }
      }
      
      .grid-line { stroke: #30363D; stroke-width: 1; opacity: 0.5; }
      .accent-line { stroke: #3FB950; stroke-width: 1.5; fill: none; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw-line 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
      .glow-circle { animation: pulse-glow 4s ease-in-out infinite; }
      .floating { animation: float-slow 6s ease-in-out infinite; transform-origin: center; }
      
      /* Geometric precision */
      .geo-shape { stroke: #8B949E; stroke-width: 1; fill: none; opacity: 0.4; }
    </style>
    
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" class="grid-line"/>
    </pattern>
    
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3FB950"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="12"/>
  <rect width="100%" height="100%" fill="url(#grid)" rx="12"/>
  
  <!-- Central Glow -->
  <circle cx="425" cy="150" r="250" fill="url(#glow)" class="glow-circle"/>
  
  <!-- Architectural Lines (Symmetrical, deliberate) -->
  <path d="M 0 150 L 200 150 L 250 110 L 600 110 L 650 150 L 850 150" class="accent-line"/>
  <path d="M 250 110 L 250 50" class="accent-line" style="stroke: #8B949E; stroke-width: 1; opacity: 0.5;"/>
  <path d="M 600 110 L 600 50" class="accent-line" style="stroke: #8B949E; stroke-width: 1; opacity: 0.5;"/>
  <path d="M 425 110 L 425 70" class="accent-line" style="stroke: #3FB950; stroke-width: 1; opacity: 0.5;"/>

  <!-- Centered Content using Absolute X/Y to avoid transform bugs on GitHub -->
  <text x="425" y="140" text-anchor="middle" class="text-title floating">IBRAHIM SHAKEEL</text>
  <text x="425" y="180" text-anchor="middle" class="text-subtitle floating">AI &amp; FULL-STACK PRODUCT ENGINEER</text>
  
  <!-- Precise Geometric Decor -->
  <!-- Left target -->
  <circle cx="100" cy="150" r="20" class="geo-shape"/>
  <circle cx="100" cy="150" r="4" fill="#3FB950"/>
  <line x1="70" y1="150" x2="90" y2="150" class="geo-shape"/>
  <line x1="110" y1="150" x2="130" y2="150" class="geo-shape"/>
  <line x1="100" y1="120" x2="100" y2="140" class="geo-shape"/>
  <line x1="100" y1="160" x2="100" y2="180" class="geo-shape"/>

  <!-- Right target -->
  <polygon points="750,130 770,150 750,170 730,150" class="geo-shape"/>
  <circle cx="750" cy="150" r="4" fill="#3FB950"/>
  <line x1="720" y1="150" x2="740" y2="150" class="geo-shape"/>
  <line x1="760" y1="150" x2="780" y2="150" class="geo-shape"/>
  <line x1="750" y1="120" x2="750" y2="140" class="geo-shape"/>
  <line x1="750" y1="160" x2="750" y2="180" class="geo-shape"/>
  
  <!-- Bottom technical readouts -->
  <text x="25" y="280" font-family="ui-monospace, Monaco, monospace" font-size="11" fill="#8B949E">SYS.LOC: LAHORE_PK [31.52°N, 74.35°E]</text>
  <text x="825" y="280" font-family="ui-monospace, Monaco, monospace" font-size="11" fill="#8B949E" text-anchor="end">SYS.STAT: OPEN_FOR_OPPORTUNITIES</text>
</svg>
