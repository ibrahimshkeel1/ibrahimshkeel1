<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: transparent; }
      .panel { fill: #161B22; stroke: #30363D; stroke-width: 1.5; rx: 10px; }
      .text-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 38px; font-weight: 800; fill: #C9D1D9; letter-spacing: 1px; }
      .text-title { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 15px; fill: #3FB950; letter-spacing: 0.5px; }
      .text-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #8B949E; line-height: 1.5; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #8B949E; text-transform: uppercase; letter-spacing: 0.5px; }
      .text-mono-value { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 14px; fill: #E6EDF3; font-weight: bold; }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.9); }
      }
      .dot { fill: #3FB950; animation: pulse 2s infinite; }
      .dot-mac-r { fill: #FF5F56; }
      .dot-mac-y { fill: #FFBD2E; }
      .dot-mac-g { fill: #27C93F; }

      @keyframes slideUp {
        from { transform: translateY(15px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .anim-slide { animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }

      @keyframes drawPath {
        to { stroke-dashoffset: 0; }
      }
      .anim-draw {
        stroke-dasharray: 2500;
        stroke-dashoffset: 2500;
        animation: drawPath 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
    </style>
  </defs>

  <!-- Left Main Panel (Terminal) -->
  <rect x="5" y="10" width="550" height="280" class="panel anim-draw"/>
  <path d="M 5 45 L 555 45" stroke="#30363D" stroke-width="1.5" class="anim-draw"/>
  
  <!-- Mac Dots -->
  <circle cx="30" cy="27" r="6" class="dot-mac-r"/>
  <circle cx="50" cy="27" r="6" class="dot-mac-y"/>
  <circle cx="70" cy="27" r="6" class="dot-mac-g"/>
  <text x="280" y="31" class="text-mono" text-anchor="middle" fill="#8B949E">ibrahimshkeel — bash — 80x24</text>

  <g transform="translate(45, 100)">
    <text x="0" y="0" class="text-name anim-slide" style="animation-delay: 0.2s;">IBRAHIM SHAKEEL</text>
    <text x="0" y="35" class="text-title anim-slide" style="animation-delay: 0.4s;">$ AI &amp; FULL-STACK PRODUCT ENGINEER</text>
    
    <text x="0" y="85" class="text-desc anim-slide" style="animation-delay: 0.6s;">> Architecting multi-agent AI pipelines and automation workflows.</text>
    <text x="0" y="120" class="text-desc anim-slide" style="animation-delay: 0.7s;">> Building scalable vertical SaaS and high-performance marketplaces.</text>
    <text x="0" y="155" class="text-desc anim-slide" style="animation-delay: 0.8s;">> Turning repetitive, complex problems into robust, simple systems.</text>
  </g>

  <!-- Right Top Panel (Location) -->
  <rect x="575" y="10" width="265" height="135" class="panel anim-draw" style="animation-delay: 0.2s;"/>
  <g transform="translate(605, 45)">
    <circle cx="0" cy="-4" r="5" class="dot"/>
    <text x="15" y="0" class="text-mono">SYS.LOCATION</text>
    <text x="0" y="40" class="text-mono-value anim-slide" style="animation-delay: 0.4s;">Lahore, Pakistan</text>
    <text x="0" y="65" class="text-mono anim-slide" style="animation-delay: 0.5s; fill: #8B949E;">LAT: 31.5204° N</text>
    <text x="0" y="85" class="text-mono anim-slide" style="animation-delay: 0.6s; fill: #8B949E;">LNG: 74.3587° E</text>
  </g>

  <!-- Right Bottom Panel (Status) -->
  <rect x="575" y="155" width="265" height="135" class="panel anim-draw" style="animation-delay: 0.4s;"/>
  <g transform="translate(605, 190)">
    <text x="0" y="0" class="text-mono">SYS.STATUS</text>
    <rect x="0" y="20" width="90" height="26" fill="#238636" rx="13" class="anim-slide" style="animation-delay: 0.6s;"/>
    <text x="13" y="37" class="text-mono-value anim-slide" fill="#ffffff" style="animation-delay: 0.7s;">AVAILABLE</text>
    <text x="0" y="70" class="text-mono anim-slide" style="animation-delay: 0.8s; fill: #8B949E;">> New opportunities</text>
    <text x="0" y="90" class="text-mono anim-slide" style="animation-delay: 0.9s; fill: #8B949E;">> Contract &amp; Full-time</text>
  </g>

</svg>
