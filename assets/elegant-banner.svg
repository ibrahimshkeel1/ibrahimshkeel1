<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #171B1C; }
      .grid-line { stroke: #E7E0D4; stroke-width: 1; opacity: 0.03; }
      
      .text-title { font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 52px; font-weight: 800; fill: #E7E0D4; letter-spacing: -1.5px; }
      .text-subtitle { font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 22px; font-weight: 500; fill: #D9D0C4; opacity: 0.9; letter-spacing: -0.5px; }
      .text-mono { font-family: "JetBrains Mono", ui-monospace, Monaco, monospace; font-size: 10px; fill: #183B3F; letter-spacing: 3px; font-weight: 700; text-transform: uppercase; }
      
      .accent-box { stroke: #183B3F; stroke-width: 2; fill: none; }
      .accent-fill { fill: #183B3F; }
      
      @keyframes subtle-pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }
      .anim-dot { animation: subtle-pulse 4s ease-in-out infinite; }
    </style>
    
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" class="grid-line"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" rx="12"/>
  <rect width="100%" height="100%" fill="url(#grid)" rx="12"/>
  
  <!-- IS Logo Top Left -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="36" height="36" class="accent-box"/>
    <text x="18" y="23" class="text-mono" text-anchor="middle" style="fill: #183B3F; font-size: 14px; letter-spacing: 0;">IS</text>
  </g>
  
  <!-- Main Typography -->
  <text x="60" y="145" class="text-title">Ibrahim Shakeel.</text>
  <text x="60" y="185" class="text-subtitle">Full-Stack Product Engineer</text>
  
  <!-- Minimalist Divider & Accents -->
  <line x1="60" y1="215" x2="90" y2="215" stroke="#183B3F" stroke-width="4"/>
  <line x1="100" y1="215" x2="790" y2="215" stroke="#183B3F" stroke-width="1" opacity="0.3"/>
  <circle cx="790" cy="215" r="2.5" class="accent-fill anim-dot"/>
  
  <!-- Subtle Data Readouts -->
  <text x="790" y="60" class="text-mono" text-anchor="end" style="fill: #E7E0D4;" opacity="0.3">BUILDING AI SYSTEMS</text>
  <text x="790" y="80" class="text-mono" text-anchor="end" style="fill: #E7E0D4;" opacity="0.3">LAHORE, PK</text>
  <text x="790" y="185" class="text-mono" text-anchor="end" opacity="0.8">AVAILABLE FOR NEW OPPORTUNITIES</text>
</svg>
