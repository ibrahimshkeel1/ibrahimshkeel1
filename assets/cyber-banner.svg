<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0D1117; }
      
      /* Typography */
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 52px; font-weight: 900; fill: #E6EDF3; letter-spacing: 4px; }
      .text-subtitle { font-family: ui-monospace, SFMono-Regular, Monaco, monospace; font-size: 16px; fill: #3FB950; letter-spacing: 2px; }
      
      /* Animations */
      @keyframes float-slow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.15; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(1.05); }
      }
      @keyframes draw-line {
        from { stroke-dashoffset: 1000; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .grid-line { stroke: #30363D; stroke-width: 1; opacity: 0.5; }
      .accent-line { stroke: #3FB950; stroke-width: 1.5; fill: none; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw-line 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
      .glow-circle { animation: pulse-glow 4s ease-in-out infinite; }
      .floating { animation: float-slow 6s ease-in-out infinite; }
      .fade { opacity: 0; animation: fade-in 1s ease-out forwards; }
      
      /* Geometric precision */
      .geo-shape { stroke: #8B949E; stroke-width: 1; fill: none; opacity: 0.4; }
    </style>
    
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" class="grid-line"/>
    </pattern>
    
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3FB950"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="12"/>
  <rect width="100%" height="100%" fill="url(#grid)" rx="12"/>
  
  <!-- Central Glow -->
  <circle cx="425" cy="150" r="250" fill="url(#glow)" class="glow-circle"/>
  
  <!-- Architectural Lines (Symmetrical, deliberate) -->
  <path d="M 0 150 L 200 150 L 250 110 L 600 110 L 650 150 L 850 150" class="accent-line" style="animation-delay: 0.1s;"/>
  <path d="M 250 110 L 250 50" class="accent-line" style="animation-delay: 0.3s; stroke: #8B949E; stroke-width: 1; opacity: 0.5;"/>
  <path d="M 600 110 L 600 50" class="accent-line" style="animation-delay: 0.3s; stroke: #8B949E; stroke-width: 1; opacity: 0.5;"/>
  <path d="M 425 110 L 425 70" class="accent-line" style="animation-delay: 0.5s; stroke: #3FB950; stroke-width: 1; opacity: 0.5;"/>

  <!-- Centered Content -->
  <g transform="translate(425, 140)" text-anchor="middle" class="floating">
    <text x="0" y="0" class="text-title fade" style="animation-delay: 0.4s;">IBRAHIM SHAKEEL</text>
    <text x="0" y="40" class="text-subtitle fade" style="animation-delay: 0.6s;">AI &amp; FULL-STACK PRODUCT ENGINEER</text>
  </g>
  
  <!-- Precise Geometric Decor -->
  <!-- Left target -->
  <g transform="translate(100, 150)" class="fade" style="animation-delay: 0.8s;">
    <circle cx="0" cy="0" r="20" class="geo-shape"/>
    <circle cx="0" cy="0" r="4" fill="#3FB950"/>
    <line x1="-30" y1="0" x2="-10" y2="0" class="geo-shape"/>
    <line x1="10" y1="0" x2="30" y2="0" class="geo-shape"/>
    <line x1="0" y1="-30" x2="0" y2="-10" class="geo-shape"/>
    <line x1="0" y1="10" x2="0" y2="30" class="geo-shape"/>
  </g>
  <!-- Right target -->
  <g transform="translate(750, 150)" class="fade" style="animation-delay: 0.8s;">
    <rect x="-14" y="-14" width="28" height="28" class="geo-shape" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="4" fill="#3FB950"/>
    <line x1="-30" y1="0" x2="-10" y2="0" class="geo-shape"/>
    <line x1="10" y1="0" x2="30" y2="0" class="geo-shape"/>
    <line x1="0" y1="-30" x2="0" y2="-10" class="geo-shape"/>
    <line x1="0" y1="10" x2="0" y2="30" class="geo-shape"/>
  </g>
  
  <!-- Bottom technical readouts -->
  <text x="25" y="280" font-family="ui-monospace, Monaco, monospace" font-size="11" fill="#8B949E" class="fade" style="animation-delay: 1s;">SYS.LOC: LAHORE_PK [31.52°N, 74.35°E]</text>
  <text x="825" y="280" font-family="ui-monospace, Monaco, monospace" font-size="11" fill="#8B949E" text-anchor="end" class="fade" style="animation-delay: 1s;">SYS.STAT: OPEN_FOR_OPPORTUNITIES</text>
</svg>
